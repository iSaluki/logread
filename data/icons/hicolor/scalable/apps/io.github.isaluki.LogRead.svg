<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6e3e0"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
  </defs>

  <!-- the log itself -->
  <path d="M26 12h54l22 22v76a6 6 0 0 1-6 6H26a6 6 0 0 1-6-6V18a6 6 0 0 1 6-6z"
        fill="url(#paper)" stroke="#c0bfbc" stroke-width="2"/>
  <path d="M80 12l22 22H86a6 6 0 0 1-6-6z" fill="#c0bfbc"/>

  <!-- lines of a log, with one error and one warning picked out -->
  <g stroke-linecap="round" stroke-width="5">
    <path d="M34 48h40" stroke="#9a9996"/>
    <path d="M34 62h54" stroke="#e01b24"/>
    <path d="M34 76h34" stroke="#9a9996"/>
    <path d="M34 90h46" stroke="#e5a50a"/>
  </g>

  <!-- reading glass -->
  <g transform="translate(6 4)">
    <circle cx="86" cy="84" r="24" fill="url(#lens)" fill-opacity="0.22"
            stroke="url(#lens)" stroke-width="8"/>
    <path d="M103 101l14 14" stroke="#1c71d8" stroke-width="11" stroke-linecap="round"/>
  </g>
</svg>
