name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install checkers
        run: python -m pip install --upgrade pip ruff build

      - name: Lint
        run: ruff check src tests

      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Install GTK4 and the GObject bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 \
            libadwaita-1-0 adwaita-icon-theme xvfb

      - name: Import the UI against real GTK4
        # python3-gi installs into the distribution's interpreter, so this step
        # uses /usr/bin/python3 rather than the one setup-python put on PATH.
        run: |
          /usr/bin/python3 -c "import gi; print('PyGObject', gi.__version__)"
          xvfb-run -a env PYTHONPATH=src GDK_BACKEND=x11 GSK_RENDERER=cairo \
            /usr/bin/python3 -c "
          import gi
          gi.require_version('Gtk', '4.0')
          gi.require_version('Adw', '1')
          from gi.repository import Adw, Gtk
          Adw.init()
          import logread.app, logread.ui.window, logread.ui.logpage
          import logread.ui.sidebar, logread.ui.overview, logread.ui.problems
          import logread.ui.rawview, logread.ui.timeline, logread.ui.preferences
          import logread.ui.icons, logread.ui.dialogs, logread.ui.format
          print('UI modules import cleanly against GTK %d.%d / libadwaita %d.%d'
                % (Gtk.get_major_version(), Gtk.get_minor_version(),
                   Adw.MAJOR_VERSION, Adw.MINOR_VERSION))
          "

      - name: Build the window headlessly
        # Constructing the whole widget tree catches the mistakes that only
        # appear when GTK actually realises a widget.
        run: |
          xvfb-run -a env PYTHONPATH=src GDK_BACKEND=x11 GSK_RENDERER=cairo \
            /usr/bin/python3 tests/smoke_window.py

  wheel:
    name: Python wheel and sdist
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: logread-python
          path: dist/*
          if-no-files-found: error

  deb:
    name: Debian package
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev fakeroot

      - name: Assemble the package tree
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ROOT="pkgroot"
          SITE="$ROOT/usr/lib/python3/dist-packages"
          mkdir -p "$SITE" "$ROOT/usr/bin" "$ROOT/DEBIAN" \
                   "$ROOT/usr/share/applications" \
                   "$ROOT/usr/share/metainfo" \
                   "$ROOT/usr/share/icons/hicolor/scalable/apps" \
                   "$ROOT/usr/share/icons/hicolor/symbolic/apps" \
                   "$ROOT/usr/share/doc/logread"
          cp -r src/logread "$SITE/"
          find "$SITE" -name '__pycache__' -type d -exec rm -rf {} +
          sed -e 's|@PYTHON@|/usr/bin/python3|' \
              -e 's|@PKGDATADIR@|/usr/lib/python3/dist-packages|' \
              logread.in > "$ROOT/usr/bin/logread"
          chmod 755 "$ROOT/usr/bin/logread"
          cp data/io.github.isaluki.LogRead.desktop "$ROOT/usr/share/applications/"
          cp data/io.github.isaluki.LogRead.metainfo.xml "$ROOT/usr/share/metainfo/"
          cp data/icons/hicolor/scalable/apps/*.svg "$ROOT/usr/share/icons/hicolor/scalable/apps/"
          cp data/icons/hicolor/symbolic/apps/*.svg "$ROOT/usr/share/icons/hicolor/symbolic/apps/"
          cp README.md LICENSE "$ROOT/usr/share/doc/logread/"
          cat > "$ROOT/DEBIAN/control" <<CONTROL
          Package: logread
          Version: $VERSION
          Section: utils
          Priority: optional
          Architecture: all
          Depends: python3 (>= 3.9), python3-gi, gir1.2-gtk-4.0, gir1.2-adw-1, libadwaita-1-0
          Recommends: policykit-1, systemd
          Maintainer: The LogRead contributors <noreply@github.com>
          Homepage: https://github.com/iSaluki/logread
          Description: Read the logs on this computer
           LogRead finds the logs on your computer and shows them by the
           application or service they belong to, summarises the errors and
           warnings in each, and shows the raw text when you want it.
          CONTROL

      - name: Build the .deb
        run: |
          fakeroot dpkg-deb --build pkgroot "logread_${VERSION}_all.deb"
          dpkg-deb --info "logread_${VERSION}_all.deb"
          dpkg-deb --contents "logread_${VERSION}_all.deb" | head -30

      - uses: actions/upload-artifact@v4
        with:
          name: logread-deb
          path: "*.deb"
          if-no-files-found: error

  rpm:
    name: Fedora package
    needs: check
    runs-on: ubuntu-latest
    # Pinned so a new Fedora cannot change the build under us. Bump it when a
    # release goes end of life, or its repository metadata stops resolving.
    # The package itself is version independent, so one built here installs on
    # older releases too.
    container: fedora:44
    steps:
      - name: Install packaging tools
        # python3 is listed explicitly. It used to arrive by way of
        # python3-devel, and dropping that left the %check stage with no
        # interpreter to run the tests with.
        run: |
          dnf -y install rpm-build git-core sed findutils tar gzip python3
          for tool in rpmbuild tar gzip sed find python3; do
            command -v "$tool" >/dev/null || { echo "missing build tool: $tool"; exit 1; }
          done

      - uses: actions/checkout@v4

      - name: Build the RPM
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          tar --exclude-vcs --transform "s,^\\.,logread-$VERSION," -czf \
            ~/rpmbuild/SOURCES/logread-$VERSION.tar.gz .
          sed "s/@VERSION@/$VERSION/g" packaging/logread.spec.in > ~/rpmbuild/SPECS/logread.spec
          rpmbuild -ba ~/rpmbuild/SPECS/logread.spec
          mkdir -p out
          find ~/rpmbuild/RPMS ~/rpmbuild/SRPMS -name '*.rpm' -exec cp {} out/ \;
          ls -la out

      - name: Install what was built
        # Building a package says nothing about whether it can be installed.
        # This resolves its dependencies for real, which is what catches a
        # package accidentally pinned to the build host's Python, and then
        # imports it through the path the launcher uses.
        run: |
          dnf -y install ./out/logread-*.noarch.rpm
          echo "--- dependencies as resolved ---"
          rpm -q --requires logread | grep -v '^rpmlib'
          echo "--- the launcher ---"
          test -x /usr/bin/logread
          head -1 /usr/bin/logread
          echo "--- importable from where the launcher looks ---"
          /usr/bin/python3 -c "
          import sys
          sys.path.insert(1, '/usr/share/logread')
          import logread.app
          from importlib.resources import files
          assert (files('logread.ui') / 'style.css').is_file(), 'the stylesheet is missing'
          print('LogRead', logread.app.VERSION, 'installs, imports and carries its stylesheet')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: logread-rpm
          path: out/*.rpm
          if-no-files-found: error

  release:
    name: Publish
    # Every commit to main refreshes a rolling prerelease so the latest
    # packages are always downloadable; tags get a permanent release.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [wheel, deb, rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the build outputs
        run: |
          mkdir -p release
          find artifacts -type f \
            \( -name '*.whl' -o -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} release/ \;
          ls -la release
          test -n "$(ls -A release)" || { echo "nothing was built"; exit 1; }

      - name: Publish the rolling build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          # Recreate rather than update, so the tag follows the commit the
          # attached packages were actually built from.
          gh release delete continuous --yes --cleanup-tag || true
          gh release create continuous release/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Continuous build ($VERSION)" \
            --notes "Built from \`${GITHUB_SHA::7}\` on $(date -u '+%Y-%m-%d %H:%M UTC').

          These packages track \`main\` and are replaced by every commit. For something
          stable, use a tagged release.

          | File | Install with |
          | --- | --- |
          | \`logread-$VERSION-1.*.noarch.rpm\` | \`sudo dnf install ./logread-*.rpm\` |
          | \`logread_${VERSION}_all.deb\` | \`sudo apt install ./logread_*.deb\` |
          | \`logread-$VERSION-py3-none-any.whl\` | \`pipx install ./logread-*.whl\` |

          The RPM and the .deb are architecture independent and carry no dependency on a
          particular Python version, so one file works across distribution releases."

      - name: Publish the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
